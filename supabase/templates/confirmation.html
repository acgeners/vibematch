<!--
  Email de confirmação de cadastro.

  ⚠️ Hoje ele NÃO é enviado na nuvem: `mailer_autoconfirm = true` (e `enable_confirmations = false`
  no local), então a conta já nasce confirmada. Fica traduzido porque o ramo existe no código —
  `signUpAction` responde "Confirme pelo link enviado ao seu email" quando não vem sessão — e é o
  que passa a valer no dia em que a confirmação for ligada.
-->
<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 32px 24px; color: #1c1917;">
  <p style="margin: 0 0 24px; font-size: 15px; font-weight: 700; letter-spacing: -0.01em;">SatorIA</p>

  <h2 style="margin: 0 0 12px; font-size: 20px; font-weight: 700; letter-spacing: -0.02em;">Confirme seu email</h2>

  <p style="margin: 0 0 20px; font-size: 15px; line-height: 1.6; color: #44403c;">
    Falta um passo para concluir seu cadastro. Clique no botão abaixo para confirmar este endereço.
  </p>

  <p style="margin: 0 0 24px;">
    <a href="{{ .ConfirmationURL }}"
       style="display: inline-block; background: #1c1917; color: #ffffff; text-decoration: none; padding: 12px 22px; border-radius: 8px; font-size: 15px; font-weight: 500;">
      Confirmar email
    </a>
  </p>

  <p style="margin: 0 0 20px; font-size: 13px; line-height: 1.6; color: #78716c;">
    Se o botão não abrir, copie e cole este endereço no navegador:<br />
    <span style="word-break: break-all; color: #57534e;">{{ .ConfirmationURL }}</span>
  </p>

  <p style="margin: 0; padding-top: 20px; border-top: 1px solid #e7e5e4; font-size: 13px; line-height: 1.6; color: #78716c;">
    Se você não criou esta conta, pode ignorar este email.
  </p>
</div>
