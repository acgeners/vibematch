app = "satoria"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    NEXT_PUBLIC_SUPABASE_URL = "https://obwlwukwovetgjqdpizd.supabase.co"
    NEXT_PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_U7-TZWz9sq89uj8i3uYE0A_sDzi-c1s"  # publishable/anon, ok no toml

[env]
  NODE_ENV = "production"
  TZ = "America/Sao_Paulo"
  # Host público, para os links que o Supabase monta e envia por email (reset de senha).
  # Não pode sair dos headers: atrás do proxy o servidor enxerga 0.0.0.0:3000 (ver lib/site-url.ts).
  SITE_URL = "https://satoria.fly.dev"
  FLARESOLVERR_URL = "http://vibematch-flaresolverr.flycast:8191/v1"
  COMIX_FS_SESSION = "comix"
  COMIX_CF_ABORT_MS = "25000"
  # Descoberta automática do slug do Mangago na avaliação (`resolveMangagoForEvalContext`,
  # atrás desta flag, fail-soft, persiste só em banda AUTO). Estava `true` no `.env.local`
  # e AUSENTE aqui — ou seja, DESLIGADA em produção pelo default, então obra criada em prod
  # não ganhava vínculo com a fonte que mais tem reviews no acervo (8.922).
  #
  # ⚠️ Só faz sentido a partir de 2026-08-11: o Mangago é Cloudflare-gated e NÃO tem sidecar
  # — quem o atravessa é o FlareSolverr, que até então nunca havia sido deployado. Ligar a
  # flag antes disso teria sido no-op caro (uma busca falhando por obra avaliada).
  MANGAGO_RESOLVE_ENABLED = "true"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"    # economiza quando ocioso
  auto_start_machines = true
  min_machines_running = 0        # sobe sob demanda (cold start ~poucos s)

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
