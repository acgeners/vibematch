# App Fly INTERNO (só o app principal o consome, via rede privada .flycast).
# O app aponta COMIX_RENDER_URL=http://comix-render.flycast:8790
app = "comix-render"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8790"
  MAX_CONCURRENCY = "3"
  # Timeouts (ms) — ajustáveis sem rebuild:
  TOTAL_TIMEOUT_MS = "20000"
  NAV_TIMEOUT_MS = "12000"
  XHR_TIMEOUT_MS = "8000"

[http_service]
  internal_port = 8790
  force_https = false
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  # Readiness: o Fly só roteia quando o BROWSER está apto (/ready), não só o processo (/health).
  [[http_service.checks]]
    interval = "15s"
    timeout = "4s"
    grace_period = "25s"
    method = "GET"
    path = "/ready"

# Chromium + 3 contextos simultâneos pedem RAM folgada.
[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
